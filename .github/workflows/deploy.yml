name: Deploy Frontend (React) to cPanel

on:
  push:
    branches:
      - the-so-called-done
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # VITE_API_BASE_URL is baked into the bundle at build time.
      # Set it as a GitHub repo secret (e.g. https://api.yourdomain.com/api).
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # Host firewall blocks FTP (21) and HTTPS (443) from GitHub runners.
      # Port 2083 (cPanel) is reachable, so we upload a tarball of dist/
      # through the UAPI File Manager and extract it into the docroot.
      # Required secrets: CPANEL_USERNAME, CPANEL_API_TOKEN
      # (cPanel > Manage API Tokens). FTP_HOST and FTP_PATH are reused.
      - name: Deploy via cPanel UAPI (port 2083)
        env:
          CPANEL_HOST: ${{ secrets.FTP_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          DEPLOY_DIR: ${{ secrets.FTP_PATH }} # e.g. /home/cpaneluser/public_html/
        run: |
          set -euo pipefail
          AUTH="Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN"
          HOST="$(echo "$CPANEL_HOST" | tr -d '[:space:]')"
          HOST="${HOST#*://}"; HOST="${HOST%%/*}"; HOST="${HOST%%:*}"
          REL="${DEPLOY_DIR#/home/*/}"
          REL="${REL#/}"; REL="${REL%/}"
          echo "Deploying to $DEPLOY_DIR (relative: $REL) on $HOST"

          # cPanel API2 fileop — this host's UAPI has no Fileman::fileop.
          fileop() {
            curl -sfS -H "$AUTH" \
              "https://$HOST:2083/json-api/cpanel?cpanel_jsonapi_version=2&cpanel_jsonapi_user=$CPANEL_USER&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&cpanel_jsonapi_apiversion=2&$1&doubledecode=0"
          }
          check() { echo "$1"; echo "$1" | grep -Eq '"status":1|"error":null' || { echo "API call FAILED"; exit 1; }; }

          tar -C dist -czf /tmp/deploy.tar.gz .

          echo "== upload tarball =="
          resp=$(curl -sfS -H "$AUTH" \
            "https://$HOST:2083/execute/Fileman/upload_files?dir=$REL&overwrite=1" \
            -F "file-0=@/tmp/deploy.tar.gz;filename=deploy.tar.gz")
          check "$resp"

          echo "== extract on server =="
          resp=$(fileop "op=extract&sourcefiles=$REL%2Fdeploy.tar.gz&destfiles=$REL")
          check "$resp"

          echo "== remove tarball =="
          resp=$(fileop "op=trash&sourcefiles=$REL%2Fdeploy.tar.gz") || true
          echo "$resp"
          echo "$resp" | grep -Eq '"status":1|"error":null' \
            || echo "cleanup failed (leftover deploy.tar.gz — remove via File Manager)"

# ────────────────────────────────────────────────────────────────────────────
# NOTES:
# - public/.htaccess ships with the build and rewrites deep links to
#   index.html (React Router needs it on Apache). If the frontend and API
#   share one docroot, add a rule to exclude the /api path instead.
# ────────────────────────────────────────────────────────────────────────────
