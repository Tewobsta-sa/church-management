name: Deploy Frontend (React) to cPanel

on:
  push:
    branches:
      - the-so-called-done
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # VITE_API_BASE_URL is baked into the bundle at build time.
      # Set it as a GitHub repo secret (e.g. https://api.yourdomain.com/api).
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # Host firewall blocks FTP (21) and HTTPS (443) from GitHub runners.
      # Port 2083 (cPanel) is reachable, so we upload a tarball of dist/
      # through the UAPI File Manager and extract it into the docroot.
      # Required secrets: CPANEL_USERNAME, CPANEL_API_TOKEN
      # (cPanel > Manage API Tokens). FTP_HOST and FTP_PATH are reused.
      - name: Deploy via cPanel UAPI (port 2083)
        env:
          CPANEL_HOST: ${{ secrets.FTP_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          DEPLOY_DIR: ${{ secrets.FTP_PATH }} # e.g. /home/cpaneluser/public_html/
        run: |
          set -euo pipefail
          AUTH="Authorization: cpanel $CPANEL_USER:$CPANEL_TOKEN"
          HOST="$(echo "$CPANEL_HOST" | tr -d '[:space:]')"
          HOST="${HOST#*://}"; HOST="${HOST%%/*}"; HOST="${HOST%%:*}"
          REL="${DEPLOY_DIR#/home/*/}"
          REL="${REL#/}"; REL="${REL%/}"
          echo "Deploying to $DEPLOY_DIR (relative: $REL) on $HOST"

          # Note: Fileman::fileop extract does NOT overwrite existing files,
          # and 443 is blocked from runners — so extraction runs via a
          # one-shot cron job added through the UAPI (tar overwrites).
          check() { echo "$1"; echo "$1" | grep -q '"status":1' || { echo "API call FAILED"; exit 1; }; }

          tar -C dist -czf /tmp/deploy.tar.gz .

          echo "== upload tarball =="
          resp=$(curl -sfS -H "$AUTH" \
            "https://$HOST:2083/execute/Fileman/upload_files?dir=$REL&overwrite=1" \
            -F "file-0=@/tmp/deploy.tar.gz;filename=deploy.tar.gz")
          check "$resp"

          echo "== schedule extract via cron =="
          resp=$(curl -sfS -G -H "$AUTH" "https://$HOST:2083/execute/Cron/add_line" \
            --data-urlencode "command=cd ~/$REL && tar xzf deploy.tar.gz && rm -f deploy.tar.gz" \
            --data-urlencode "minute=*" --data-urlencode "hour=*" \
            --data-urlencode "day=*" --data-urlencode "month=*" \
            --data-urlencode "weekday=*")
          check "$resp"

          echo "== wait for cron to extract (up to ~2 min) =="
          for i in 1 2; do
            sleep 75
            files=$(curl -sfS -H "$AUTH" \
              "https://$HOST:2083/execute/Fileman/list_files?dir=$REL&types=file")
            echo "$files" | grep -q deploy.tar.gz || break
          done
          echo "$files" | grep -q deploy.tar.gz \
            && { echo "tarball still present — extract did not run"; exit 1; }
          echo "extract done (tarball removed by cron)"

          echo "== remove cron line =="
          list=$(curl -sfS -H "$AUTH" "https://$HOST:2083/execute/Cron/list_cron")
          LN=$(echo "$list" | jq -r '.data | .. | objects
                | select(.command? and (.command | contains("deploy.tar.gz")))
                | .line_number' | head -1)
          if [ -n "$LN" ]; then
            resp=$(curl -sfS -H "$AUTH" \
              "https://$HOST:2083/execute/Cron/remove_line?line_number=$LN")
            echo "$resp"
          else
            echo "cron line not found — check cPanel > Cron Jobs manually"
          fi

# ────────────────────────────────────────────────────────────────────────────
# NOTES:
# - public/.htaccess ships with the build and rewrites deep links to
#   index.html (React Router needs it on Apache). If the frontend and API
#   share one docroot, add a rule to exclude the /api path instead.
# ────────────────────────────────────────────────────────────────────────────
